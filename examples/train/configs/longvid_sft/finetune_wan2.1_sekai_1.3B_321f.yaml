# Wan 2.1 T2V 1.3B finetune on Sekai game walking dataset (321-frame clips)
# 321 frames @ 16 FPS = ~20 seconds per clip, latent T=81
# Stage 3 of curriculum learning (after 161f stage)

models:
  student:
    _target_: fastvideo.train.models.wan.WanModel
    init_from: Wan-AI/Wan2.1-T2V-1.3B-Diffusers
    trainable: true

method:
  _target_: fastvideo.train.methods.fine_tuning.finetune.FineTuneMethod

training:
  distributed:
    num_gpus: 8
    sp_size: 1
    tp_size: 1
    hsdp_replicate_dim: 4
    hsdp_shard_dim: 2

  data:
    data_path: /pfs_root/sc/dataset/sekai/sekai-game-walking-processed-321f
    dataloader_num_workers: 4
    train_batch_size: 4
    training_cfg_rate: 0.1
    seed: 42
    num_latent_t: 80
    num_height: 480
    num_width: 832
    num_frames: 317

  optimizer:
    learning_rate: 1.0e-7
    betas: [0.9, 0.999]
    weight_decay: 0.01
    lr_scheduler: constant_with_warmup
    lr_warmup_steps: 100

  loop:
    max_train_steps: 5000
    gradient_accumulation_steps: 1

  checkpoint:
    output_dir: /pfs_root/sc/outputs/sekai_wan2.1_1.3B_321f
    training_state_checkpointing_steps: 200
    checkpoints_total_limit: 5
    # resume_from_checkpoint: latest
    resume_from_checkpoint: null

  tracker:
    project_name: sekai
    run_name: wan2.1_1.3B_321f_finetune

  model:
    enable_gradient_checkpointing_type: full

pipeline:
  flow_shift: 3

callbacks:
  grad_clip:
    _target_: fastvideo.train.callbacks.grad_clip.GradNormClipCallback
    max_grad_norm: 1.0
  validation:
    _target_: fastvideo.train.callbacks.validation.ValidationCallback
    pipeline_target: fastvideo.pipelines.basic.wan.wan_pipeline.WanPipeline
    dataset_file: /pfs_root/sc/dataset/sekai/validation_samples.json
    every_steps: 200
    sampling_steps: [50]
    guidance_scale: 5.0

# Wan 2.1 T2V 1.3B finetune on SpatialVID-HQ dataset (77-frame clips)
# 77 frames @ 16 FPS = ~4.8 seconds per clip, latent T=20

models:
  student:
    _target_: fastvideo.train.models.wan.WanModel
    init_from: Wan-AI/Wan2.1-T2V-1.3B-Diffusers
    trainable: true
    flow_shift: 5

method:
  _target_: fastvideo.train.methods.fine_tuning.finetune.FineTuneMethod

training:
  distributed:
    num_gpus: 64
    sp_size: 1
    tp_size: 1
    hsdp_replicate_dim: 64
    hsdp_shard_dim: 1

  data:
    data_path: /pfs_root/sc/dataset/SpatialVID-HQ/processed-77f
    dataloader_num_workers: 4
    train_batch_size: 1
    training_cfg_rate: 0.1
    seed: 42
    num_latent_t: 20
    num_height: 480
    num_width: 832
    num_frames: 77

  optimizer:
    learning_rate: 5.0e-7
    betas: [0.9, 0.999]
    weight_decay: 0.01
    lr_scheduler: constant_with_warmup
    lr_warmup_steps: 100

  loop:
    max_train_steps: 10000
    gradient_accumulation_steps: 1

  checkpoint:
    output_dir: /pfs_root/sc/outputs/spatialvid_wan2.1_1.3B_77f
    training_state_checkpointing_steps: 200
    checkpoints_total_limit: 5
    resume_from_checkpoint: null

  tracker:
    project_name: spatialvid_hq
    run_name: wan2.1_1.3B_77f_finetune

  model:
    enable_gradient_checkpointing_type: full

callbacks:
  grad_clip:
    _target_: fastvideo.train.callbacks.grad_clip.GradNormClipCallback
    max_grad_norm: 1.0
  validation:
    _target_: fastvideo.train.callbacks.validation.ValidationCallback
    pipeline_target: fastvideo.pipelines.basic.wan.wan_pipeline.WanPipeline
    dataset_file: /pfs_root/sc/dataset/SpatialVID-HQ/validation_samples_77f.json
    every_steps: 200
    sampling_steps: [50]
    guidance_scale: 5.0

pipeline:
  flow_shift: 5
